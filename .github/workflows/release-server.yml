name: Release Server

on:
  push:
    branches:
      - "release/server/**"

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify branch, version, commit, and tag
        id: release
        run: |
          version="$(scripts/release/verify-release.sh server)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component server \
            --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v6
        with:
          name: server-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Build verified server image
    needs: [verify, ci]
    uses: ./.github/workflows/publish-server-image.yml
    with:
      mode: release
      version: ${{ needs.verify.outputs.version }}
    permissions:
      contents: read

  build:
    name: Build server (${{ matrix.os }})
    needs: [verify, ci]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build server
        run: cargo build --release --locked --package owlauth-server
      - name: Package server
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          binary="owlauth-server"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="owlauth-server.exe"
          fi
          archive="owlauth-server-${VERSION}-${host}.tar.gz"
          tar -czf "$archive" -C target/release "$binary"
      - name: Upload server artifact
        uses: actions/upload-artifact@v6
        with:
          name: owlauth-server-${{ matrix.os }}
          path: owlauth-server-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [verify, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: owlauth-server-*
          path: artifacts
          merge-multiple: true
      - name: Download release changelog
        uses: actions/download-artifact@v4
        with:
          name: server-release-notes
          path: release-metadata
      - name: Download verified server image
        uses: actions/download-artifact@v4
        with:
          name: server-container-image
          path: container-artifact
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum owlauth-server-*.tar.gz > SHA256SUMS
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh server >/dev/null
      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish server crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          scripts/release/publish-crate.sh crates/owlauth-types/Cargo.toml
          for attempt in {1..12}; do
            if scripts/release/publish-crate.sh crates/owlauth-server/Cargo.toml; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              exit 1
            fi
            sleep 10
          done
      - name: Load verified server image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gzip -dc container-artifact/server-image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION//+/_}"
          docker image inspect "$image" >/dev/null
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish versioned server image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$image:${VERSION//+/_}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "server-v${VERSION}" artifacts/* \
            --notes-file release-metadata/release-notes.md \
            --target "$GITHUB_SHA" \
            --title "OwlAuth Server v${VERSION}"
      - name: Promote server image to latest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$image:${VERSION//+/_}" "$image:latest"
          docker push "$image:latest"
