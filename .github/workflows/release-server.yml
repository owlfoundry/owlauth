name: Release Server

on:
  push:
    branches:
      - "release/server/**"

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify branch, version, commit, and tag
        id: release
        run: |
          version="$(scripts/release/verify-release.sh server)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Build verified server image
    needs: [verify, ci]
    uses: ./.github/workflows/publish-server-image.yml
    with:
      mode: release
      version: ${{ needs.verify.outputs.version }}
    permissions:
      contents: read

  build:
    name: Build server (${{ matrix.os }})
    needs: [verify, ci]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build server
        run: cargo build --release --locked --package owlauth
      - name: Package server
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          binary="owlauth"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="owlauth.exe"
          fi
          archive="owlauth-${VERSION}-${host}.tar.gz"
          tar -czf "$archive" -C target/release "$binary"
      - name: Upload server artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: owlauth-${{ matrix.os }}
          path: owlauth-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [verify, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download server artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: owlauth-*
          path: artifacts
          merge-multiple: true
      - name: Download verified server image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-container-image
          path: container-artifact
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum owlauth-*.tar.gz > SHA256SUMS
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh server >/dev/null
      - name: Load verified server image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gzip -dc container-artifact/server-image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION//+/_}"
          docker image inspect "$image" >/dev/null
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish versioned server image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$image:${VERSION//+/_}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          notes_args=(--generate-notes)
          previous_tag="$(git tag --list 'server-v*' --sort=-v:refname | sed -n '1p')"
          if [[ -n "$previous_tag" ]]; then
            notes_args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "server-v${VERSION}" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "OwlAuth Server v${VERSION}" \
            "${notes_args[@]}"
      - name: Promote server image to latest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$image:${VERSION//+/_}" "$image:latest"
          docker push "$image:latest"
