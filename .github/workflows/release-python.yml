name: Release Python SDK

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Verify tag, version, and commit
        id: release
        run: |
          version="$(scripts/release/verify-release.sh python)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component python --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v6
        with:
          name: python-release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    name: Full CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: Publish owlauth-client
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install locked Python release tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --all-packages --locked
      - name: Download immutable SDK candidate
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.ci.outputs.python-candidate-artifact-name }}
          path: candidate
      - name: Download final SDK evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.ci.outputs.sdk-final-evidence-artifact-name }}
          path: final-evidence
      - name: Download release changelog
        uses: actions/download-artifact@v7
        with:
          name: python-release-notes
          path: release-metadata
      - name: Re-verify release and exact candidate
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CANDIDATE_VERSION: ${{ needs.ci.outputs.python-candidate-version }}
          ARCHIVE_SHA256: ${{ needs.ci.outputs.python-candidate-archive-sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.ci.outputs.python-candidate-descriptor-sha256 }}
        run: |
          scripts/release/verify-release.sh python >/dev/null
          [[ "$CANDIDATE_VERSION" == "$VERSION" ]]
          archive="candidate/owlauth_client-${VERSION}-py3-none-any.whl"
          verified_sha="$(python scripts/release/verify-sdk-candidate.py \
            --component python --version "$VERSION" --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration python-hatch-wheel-v1 --tag "$GITHUB_REF_NAME" \
            --descriptor candidate/candidate.json --archive "$archive" \
            --distribution-directory candidate)"
          [[ "$verified_sha" == "$ARCHIVE_SHA256" ]]
          actual_descriptor_sha="$(sha256sum candidate/candidate.json | cut -d ' ' -f 1)"
          [[ "$actual_descriptor_sha" == "$DESCRIPTOR_SHA256" ]]
          uv run --locked twine check "$archive"
      - name: Verify final exact-artifact evidence
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python scripts/release/verify-sdk-evidence.py \
            --component python --version "$VERSION" --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --tag "$GITHUB_REF_NAME" --descriptor candidate/candidate.json \
            --manifest final-evidence/python-final-evidence.json >/dev/null
          cat final-evidence/summary.md >> release-metadata/release-notes.md
      - name: Require PyPI token
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: test -n "$TWINE_PASSWORD"
      - name: Publish the qualified wheel
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --locked twine upload --non-interactive \
            "candidate/owlauth_client-${VERSION}-py3-none-any.whl"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "python-v${VERSION}" \
            final-evidence/python-final-evidence.json \
            --notes-file release-metadata/release-notes.md \
            --title "Python SDK v${VERSION}"
