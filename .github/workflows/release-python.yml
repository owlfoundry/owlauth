name: Release Python SDK

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Verify tag, version, and commit
        id: release
        run: |
          version="$(scripts/release/verify-release.sh python)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component python --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v7
        with:
          name: python-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Build and inspect package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir dist
          (cd sdks/python && uv run --locked hatchling build -t wheel -d ../../dist)
          archive="dist/owlauth_client-${VERSION}-py3-none-any.whl"
          test -f "$archive"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1
          uv run --locked twine check "$archive"
          python3 scripts/sdk_artifact.py inspect \
            --component python --archive "$archive"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: python-release-package
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish owlauth-client
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh python >/dev/null
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: python-release-package
          path: dist
      - name: Publish package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$UV_PUBLISH_TOKEN"
          uv publish --check-url https://pypi.org/simple/owlauth-client/ dist/*.whl

  release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: python-release-package
          path: dist
      - name: Download release changelog
        uses: actions/download-artifact@v8
        with:
          name: python-release-notes
          path: release-metadata
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "python-v${VERSION}" \
            "dist/owlauth_client-${VERSION}-py3-none-any.whl" \
            --notes-file release-metadata/release-notes.md \
            --title "Python SDK v${VERSION}"

  recover-build-0-1-2:
    name: Recover Python SDK v0.1.2 package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: 0.1.2
      TAG: python-v0.1.2
      SOURCE_COMMIT: d86e072ae576b7338d72a7a19856ac5ed6cc7c47
      TAG_OBJECT: 71df96ef88cb611e99c4ad9faa803df1b8bbc056
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: d86e072ae576b7338d72a7a19856ac5ed6cc7c47
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release tag
        run: |
          test "$TAG" = "python-v${VERSION}"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test "$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')" = "$TAG_OBJECT"
          test "$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')" = "$SOURCE_COMMIT"
      - name: Prepare package and release notes
        run: |
          python3 scripts/release/prepare_release.py python "$VERSION"
          python3 scripts/release/generate-changelog.py \
            --component python --version "$VERSION" --output release-notes.md
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Build and inspect package
        run: |
          mkdir dist
          (cd sdks/python && uv run --locked hatchling build -t wheel -d ../../dist)
          archive="dist/owlauth_client-${VERSION}-py3-none-any.whl"
          test -f "$archive"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1
          uv run --locked twine check "$archive"
          python3 scripts/sdk_artifact.py inspect \
            --component python --archive "$archive"
      - name: Upload recovery package
        uses: actions/upload-artifact@v7
        with:
          name: python-0.1.2-recovery
          path: |
            dist/*.whl
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  recover-publish-0-1-2:
    name: Recover owlauth-client v0.1.2 publication
    if: github.event_name == 'workflow_dispatch'
    needs: recover-build-0-1-2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: 0.1.2
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Download recovery package
        uses: actions/download-artifact@v8
        with:
          name: python-0.1.2-recovery
          path: recovery
      - name: Publish or reuse package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$UV_PUBLISH_TOKEN"
          uv publish --check-url https://pypi.org/simple/owlauth-client/ recovery/dist/*.whl
      - name: Verify published package digest
        run: |
          python3 - "recovery/dist/owlauth_client-${VERSION}-py3-none-any.whl" <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.request

          archive = sys.argv[1]
          version = os.environ["VERSION"]
          expected = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          with urllib.request.urlopen(
              f"https://pypi.org/pypi/owlauth-client/{version}/json", timeout=30
          ) as response:
              release = json.load(response)
          files = [
              item
              for item in release["urls"]
              if item["filename"] == os.path.basename(archive)
          ]
          if len(files) != 1 or files[0]["digests"]["sha256"] != expected:
              raise SystemExit("published wheel does not match the recovery artifact")
          PY

  recover-release-0-1-2:
    name: Recover Python SDK v0.1.2 GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [recover-build-0-1-2, recover-publish-0-1-2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: 0.1.2
      TAG: python-v0.1.2
    steps:
      - name: Download recovery package
        uses: actions/download-artifact@v8
        with:
          name: python-0.1.2-recovery
          path: recovery
      - name: Create or repair GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="recovery/dist/owlauth_client-${VERSION}-py3-none-any.whl"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --notes-file recovery/release-notes.md \
              --title "Python SDK v${VERSION}"
            gh release upload "$TAG" "$archive" --clobber
          else
            gh release create "$TAG" "$archive" \
              --notes-file recovery/release-notes.md \
              --title "Python SDK v${VERSION}"
          fi
