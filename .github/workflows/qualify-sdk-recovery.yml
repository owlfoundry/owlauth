name: Qualify SDK Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: e752ff422c0ed8fef15ae27c7dd11a41bd48ca2d
  SOURCE_CI_RUN: "31258490589"
  TYPESCRIPT_TAG: typescript-v0.1.0
  TYPESCRIPT_TAG_OBJECT: dfd7c078fc9d081324cc2a65ed76ab4468cb9b87
  PYTHON_TAG: python-v0.1.0
  PYTHON_TAG_OBJECT: 67ef9404dd5552c00a72936536d87f6e1225d9cd
  RUST_TAG: rust-v0.1.0
  RUST_TAG_OBJECT: bf6432f9dd0d82c1221b8a88420987f02685f1cb
  VERSION: 0.1.0

concurrency:
  group: qualify-sdk-recovery-v0.1.0
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify frozen SDK recovery sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out recovery definition
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tags and exact successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          git fetch --quiet --force origin \
            "refs/tags/$TYPESCRIPT_TAG:refs/tags/$TYPESCRIPT_TAG" \
            "refs/tags/$PYTHON_TAG:refs/tags/$PYTHON_TAG" \
            "refs/tags/$RUST_TAG:refs/tags/$RUST_TAG"
          for specification in \
            "$TYPESCRIPT_TAG:$TYPESCRIPT_TAG_OBJECT" \
            "$PYTHON_TAG:$PYTHON_TAG_OBJECT" \
            "$RUST_TAG:$RUST_TAG_OBJECT"; do
            tag="${specification%%:*}"
            object="${specification#*:}"
            [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]]
            [[ "$(git rev-parse "refs/tags/$tag")" == "$object" ]]
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$SOURCE_COMMIT" ]]
            remote="$(git ls-remote --tags origin \
              "refs/tags/$tag" "refs/tags/$tag^{}")"
            [[ "$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<<"$remote")" == "$object" ]]
            [[ "$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote")" == \
              "$SOURCE_COMMIT" ]]
          done
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          unexpected="$(git diff --name-only "$SOURCE_COMMIT" "$GITHUB_SHA" -- \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude).github/workflows/qualify-sdk-recovery.yml' \
            ':(exclude).github/workflows/release-typescript.yml' \
            ':(exclude).github/workflows/release-python.yml' \
            ':(exclude).github/workflows/release-rust.yml')"
          [[ -z "$unexpected" ]]

          run_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN")"
          [[ "$(jq -r .path <<<"$run_json")" == .github/workflows/ci.yml ]]
          [[ "$(jq -r .event <<<"$run_json")" == push ]]
          [[ "$(jq -r .head_branch <<<"$run_json")" == main ]]
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$SOURCE_COMMIT" ]]
          [[ "$(jq -r .status <<<"$run_json")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$run_json")" == success ]]

          for pair in \
            '31259944695:.github/workflows/release-typescript.yml:failure' \
            '31259944637:.github/workflows/release-python.yml:startup_failure' \
            '31259944736:.github/workflows/release-rust.yml:failure'; do
            run_id="${pair%%:*}"
            remainder="${pair#*:}"
            path="${remainder%%:*}"
            conclusion="${remainder##*:}"
            failed="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            [[ "$(jq -r .path <<<"$failed")" == "$path" ]]
            [[ "$(jq -r .head_sha <<<"$failed")" == "$SOURCE_COMMIT" ]]
            [[ "$(jq -r .status <<<"$failed")" == completed ]]
            [[ "$(jq -r .conclusion <<<"$failed")" == "$conclusion" ]]
          done
      - name: Download exact-source contract provenance
        uses: actions/download-artifact@v8
        with:
          name: sdk-contract-provenance-31258490589-1
          path: contract
          github-token: ${{ github.token }}
          run-id: 31258490589
      - name: Verify and relay contract provenance
        run: |
          [[ "$(find contract -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1 ]]
          [[ "$(jq -r .sourceCommit contract/sdk-contract-provenance.json)" == \
            "$SOURCE_COMMIT" ]]
          python3 -m json.tool contract/sdk-contract-provenance.json >/dev/null
      - name: Upload recovery contract provenance
        uses: actions/upload-artifact@v7
        with:
          name: sdk-recovery-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract/sdk-contract-provenance.json
          if-no-files-found: error

  typescript-candidate:
    name: Build recovered TypeScript candidate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      archive-file: ${{ steps.metadata.outputs.archive-file }}
      archive-sha256: ${{ steps.metadata.outputs.archive-sha256 }}
      descriptor-sha256: ${{ steps.metadata.outputs.descriptor-sha256 }}
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare TypeScript manifests
        run: python3 scripts/release/prepare_release.py typescript "$VERSION"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download contract provenance
        uses: actions/download-artifact@v8
        with:
          name: sdk-recovery-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract
      - name: Build and describe one npm tarball
        id: metadata
        run: |
          mkdir candidate
          pnpm --filter @owlauth/client check
          pnpm --filter @owlauth/client build
          archive_file="owlauth-client-${VERSION}.tgz"
          (cd sdks/typescript && npm pack --pack-destination ../../candidate)
          [[ -f "candidate/$archive_file" ]]
          [[ "$(find candidate -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1 ]]
          python scripts/sdk_artifact.py describe --component typescript \
            --archive "candidate/$archive_file" \
            --contract-provenance contract/sdk-contract-provenance.json \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration typescript-npm-pack-v1 \
            --tag "$TYPESCRIPT_TAG" --output candidate/candidate.json
          archive_sha256="$(jq -r .archive.sha256 candidate/candidate.json)"
          descriptor_sha256="$(sha256sum candidate/candidate.json | cut -d ' ' -f 1)"
          {
            echo "artifact-name=typescript-recovery-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "archive-file=$archive_file"
            echo "archive-sha256=$archive_sha256"
            echo "descriptor-sha256=$descriptor_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable TypeScript candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: candidate
          if-no-files-found: error

  python-candidate:
    name: Build recovered Python candidate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      archive-file: ${{ steps.metadata.outputs.archive-file }}
      archive-sha256: ${{ steps.metadata.outputs.archive-sha256 }}
      descriptor-sha256: ${{ steps.metadata.outputs.descriptor-sha256 }}
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare Python manifests
        run: python3 scripts/release/prepare_release.py python "$VERSION"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Download contract provenance
        uses: actions/download-artifact@v8
        with:
          name: sdk-recovery-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract
      - name: Build and describe one wheel
        id: metadata
        run: |
          mkdir candidate
          (cd sdks/python && uv run --locked hatchling build -t wheel -d ../../candidate)
          archive_file="owlauth_client-${VERSION}-py3-none-any.whl"
          [[ -f "candidate/$archive_file" ]]
          [[ "$(find candidate -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1 ]]
          uv run --locked twine check "candidate/$archive_file"
          python scripts/sdk_artifact.py describe --component python \
            --archive "candidate/$archive_file" \
            --contract-provenance contract/sdk-contract-provenance.json \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration python-hatch-wheel-v1 \
            --tag "$PYTHON_TAG" --output candidate/candidate.json
          archive_sha256="$(jq -r .archive.sha256 candidate/candidate.json)"
          descriptor_sha256="$(sha256sum candidate/candidate.json | cut -d ' ' -f 1)"
          {
            echo "artifact-name=python-recovery-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "archive-file=$archive_file"
            echo "archive-sha256=$archive_sha256"
            echo "descriptor-sha256=$descriptor_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable Python candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: candidate
          if-no-files-found: error

  rust-candidate:
    name: Build recovered Rust candidate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      archive-file: ${{ steps.metadata.outputs.archive-file }}
      upload-metadata-file: ${{ steps.metadata.outputs.upload-metadata-file }}
      archive-sha256: ${{ steps.metadata.outputs.archive-sha256 }}
      descriptor-sha256: ${{ steps.metadata.outputs.descriptor-sha256 }}
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare Rust manifests
        run: python3 scripts/release/prepare_release.py rust "$VERSION"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Download contract provenance
        uses: actions/download-artifact@v8
        with:
          name: sdk-recovery-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract
      - name: Build and describe one crate archive
        id: metadata
        run: |
          mkdir candidate
          archive_file="owlauth-client-${VERSION}.crate"
          upload_metadata_file="owlauth-client-${VERSION}.upload.json"
          cargo package --manifest-path sdks/rust/Cargo.toml \
            --locked --allow-dirty --no-verify
          cp "target/package/$archive_file" "candidate/$archive_file"
          python scripts/sdk_artifact.py rust-upload-metadata \
            --archive "candidate/$archive_file" \
            --output "candidate/$upload_metadata_file"
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RUST_TAG" \
            python scripts/sdk_artifact.py describe --component rust \
              --archive "candidate/$archive_file" \
              --upload-metadata "candidate/$upload_metadata_file" \
              --contract-provenance contract/sdk-contract-provenance.json \
              --source-commit "$SOURCE_COMMIT" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --build-configuration rust-cargo-package-v1 \
              --tag "$RUST_TAG" --output candidate/candidate.json
          archive_sha256="$(jq -r .archive.sha256 candidate/candidate.json)"
          descriptor_sha256="$(sha256sum candidate/candidate.json | cut -d ' ' -f 1)"
          {
            echo "artifact-name=rust-recovery-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "archive-file=$archive_file"
            echo "upload-metadata-file=$upload_metadata_file"
            echo "archive-sha256=$archive_sha256"
            echo "descriptor-sha256=$descriptor_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable Rust candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: candidate
          if-no-files-found: error

  typescript-artifact:
    name: Recovered TypeScript tarball Node.js ${{ matrix.node-version }}
    needs: typescript-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare TypeScript manifests
        run: python3 scripts/release/prepare_release.py typescript "$VERSION"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.typescript-candidate.outputs.artifact-name }}
          path: candidate
      - name: Test and record exact tarball
        run: |
          scripts/test-typescript-package.sh \
            "candidate/${{ needs.typescript-candidate.outputs.archive-file }}" \
            candidate/candidate.json
          python scripts/sdk_artifact.py result \
            --component typescript --source-commit "$SOURCE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration typescript-npm-pack-v1 \
            --tag "$TYPESCRIPT_TAG" --descriptor candidate/candidate.json \
            --archive "candidate/${{ needs.typescript-candidate.outputs.archive-file }}" \
            --matrix-kind node --matrix-value "${{ matrix.node-version }}" \
            --output result.json
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: typescript-sdk-result-node-${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error

  typescript-browser:
    name: Recovered TypeScript browser bundle
    needs: typescript-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare TypeScript manifests
        run: python3 scripts/release/prepare_release.py typescript "$VERSION"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.typescript-candidate.outputs.artifact-name }}
          path: candidate
      - name: Test and record exact browser bundle
        run: |
          scripts/test-typescript-browser-package.sh \
            "candidate/${{ needs.typescript-candidate.outputs.archive-file }}" \
            candidate/candidate.json
          python scripts/sdk_artifact.py result \
            --component typescript --source-commit "$SOURCE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration typescript-npm-pack-v1 \
            --tag "$TYPESCRIPT_TAG" --descriptor candidate/candidate.json \
            --archive "candidate/${{ needs.typescript-candidate.outputs.archive-file }}" \
            --matrix-kind browser-bundle --matrix-value vite-8.1.5 \
            --output result.json
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: typescript-sdk-result-browser-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error

  python-artifact:
    name: Recovered Python wheel ${{ matrix.python-version }}
    needs: python-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare Python manifests
        run: python3 scripts/release/prepare_release.py python "$VERSION"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.python-candidate.outputs.artifact-name }}
          path: candidate
      - name: Test and record exact wheel
        run: |
          scripts/test-python-package.sh \
            "candidate/${{ needs.python-candidate.outputs.archive-file }}" \
            candidate/candidate.json
          python scripts/sdk_artifact.py result \
            --component python --source-commit "$SOURCE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration python-hatch-wheel-v1 \
            --tag "$PYTHON_TAG" --descriptor candidate/candidate.json \
            --archive "candidate/${{ needs.python-candidate.outputs.archive-file }}" \
            --distribution-directory candidate \
            --matrix-kind python --matrix-value "${{ matrix.python-version }}" \
            --output result.json
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: python-sdk-result-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error

  rust-artifact:
    name: Recovered Rust exact crate stable
    needs: rust-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare Rust manifests
        run: python3 scripts/release/prepare_release.py rust "$VERSION"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rust-candidate.outputs.artifact-name }}
          path: candidate
      - name: Test and record exact crate
        run: |
          scripts/test-rust-sdk-package.sh \
            "candidate/${{ needs.rust-candidate.outputs.archive-file }}" \
            candidate/candidate.json \
            "candidate/${{ needs.rust-candidate.outputs.upload-metadata-file }}"
          python scripts/sdk_artifact.py result \
            --component rust --source-commit "$SOURCE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration rust-cargo-package-v1 \
            --tag "$RUST_TAG" --descriptor candidate/candidate.json \
            --archive "candidate/${{ needs.rust-candidate.outputs.archive-file }}" \
            --upload-metadata "candidate/${{ needs.rust-candidate.outputs.upload-metadata-file }}" \
            --matrix-kind rust --matrix-value stable --output result.json
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: rust-sdk-result-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error

  project-auth-e2e:
    name: Recovered exact SDK Project Auth E2E
    needs: [typescript-candidate, python-candidate, rust-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare and validate combined recovered SDK manifests
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/release")
          from prepare_release import prepare_release, release_overrides, validate_version_state

          overrides = {}
          for component in ("typescript", "python", "rust"):
              prepare_release(component, "0.1.0")
              overrides.update(release_overrides(component, "0.1.0"))
          validate_version_state(Path("."), overrides)
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download TypeScript candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.typescript-candidate.outputs.artifact-name }}
          path: candidates/typescript
      - name: Download Python candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.python-candidate.outputs.artifact-name }}
          path: candidates/python
      - name: Download Rust candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rust-candidate.outputs.artifact-name }}
          path: candidates/rust
      - name: Build server and packaged CLI
        run: |
          pnpm --filter @owlauth/server-web build
          cargo build --locked --package owlauth-server
          scripts/test-cli-package.sh "${RUNNER_TEMP}/packaged-cli/owlauth"
      - name: Install browsers
        run: pnpm --filter @owlauth/server-web exec playwright install --with-deps chromium firefox
      - name: Run shared-server journeys
        env:
          OWLAUTH_E2E_TYPESCRIPT_ARCHIVE: ${{ github.workspace }}/candidates/typescript/${{ needs.typescript-candidate.outputs.archive-file }}
          OWLAUTH_E2E_TYPESCRIPT_DESCRIPTOR: ${{ github.workspace }}/candidates/typescript/candidate.json
          OWLAUTH_E2E_TYPESCRIPT_ARCHIVE_SHA256: ${{ needs.typescript-candidate.outputs.archive-sha256 }}
          OWLAUTH_E2E_TYPESCRIPT_DESCRIPTOR_SHA256: ${{ needs.typescript-candidate.outputs.descriptor-sha256 }}
          OWLAUTH_E2E_PYTHON_ARCHIVE: ${{ github.workspace }}/candidates/python/${{ needs.python-candidate.outputs.archive-file }}
          OWLAUTH_E2E_PYTHON_DESCRIPTOR: ${{ github.workspace }}/candidates/python/candidate.json
          OWLAUTH_E2E_PYTHON_ARCHIVE_SHA256: ${{ needs.python-candidate.outputs.archive-sha256 }}
          OWLAUTH_E2E_PYTHON_DESCRIPTOR_SHA256: ${{ needs.python-candidate.outputs.descriptor-sha256 }}
          OWLAUTH_E2E_RUST_ARCHIVE: ${{ github.workspace }}/candidates/rust/${{ needs.rust-candidate.outputs.archive-file }}
          OWLAUTH_E2E_RUST_DESCRIPTOR: ${{ github.workspace }}/candidates/rust/candidate.json
          OWLAUTH_E2E_RUST_UPLOAD_METADATA: ${{ github.workspace }}/candidates/rust/${{ needs.rust-candidate.outputs.upload-metadata-file }}
          OWLAUTH_E2E_RUST_ARCHIVE_SHA256: ${{ needs.rust-candidate.outputs.archive-sha256 }}
          OWLAUTH_E2E_RUST_DESCRIPTOR_SHA256: ${{ needs.rust-candidate.outputs.descriptor-sha256 }}
          OWLAUTH_E2E_EVIDENCE_DIRECTORY: ${{ runner.temp }}/sdk-e2e-evidence
          OWLAUTH_E2E_CLI_BINARY: ${{ runner.temp }}/packaged-cli/owlauth
        run: pnpm --filter @owlauth/server-web exec playwright test
      - name: Upload E2E evidence
        uses: actions/upload-artifact@v7
        with:
          name: sdk-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-e2e-evidence
          if-no-files-found: error

  evidence:
    name: Aggregate and attest recovered SDK evidence
    needs:
      - typescript-candidate
      - typescript-artifact
      - typescript-browser
      - python-candidate
      - python-artifact
      - rust-candidate
      - rust-artifact
      - project-auth-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Download candidates
        uses: actions/download-artifact@v8
        with:
          pattern: "*-recovery-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          path: candidate-artifacts
      - name: Arrange candidates
        run: |
          mkdir -p candidates/typescript candidates/python candidates/rust
          cp -R candidate-artifacts/typescript-recovery-candidate-*/. candidates/typescript/
          cp -R candidate-artifacts/python-recovery-candidate-*/. candidates/python/
          cp -R candidate-artifacts/rust-recovery-candidate-*/. candidates/rust/
      - name: Download qualification results
        uses: actions/download-artifact@v8
        with:
          pattern: "*-sdk-result-*-${{ github.run_id }}-${{ github.run_attempt }}"
          path: qualification-results
      - name: Download E2E evidence
        uses: actions/download-artifact@v8
        with:
          name: sdk-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-results
      - name: Aggregate and verify final evidence
        run: |
          python scripts/sdk_evidence.py \
            --typescript-descriptor candidates/typescript/candidate.json \
            --python-descriptor candidates/python/candidate.json \
            --rust-descriptor candidates/rust/candidate.json \
            --results-directory qualification-results \
            --e2e-directory e2e-results \
            --output-directory final-evidence
          for component in typescript python rust; do
            python scripts/release/verify-sdk-evidence.py \
              --component "$component" --version "$VERSION" \
              --source-commit "$SOURCE_COMMIT" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --tag "$(jq -r .coordinate.tag "candidates/$component/candidate.json")" \
              --descriptor "candidates/$component/candidate.json" \
              --manifest "final-evidence/$component-final-evidence.json" >/dev/null
          done
      - name: Attest candidates and evidence
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            candidates/typescript/owlauth-client-0.1.0.tgz
            candidates/typescript/candidate.json
            candidates/python/owlauth_client-0.1.0-py3-none-any.whl
            candidates/python/candidate.json
            candidates/rust/owlauth-client-0.1.0.crate
            candidates/rust/owlauth-client-0.1.0.upload.json
            candidates/rust/candidate.json
            final-evidence/*.json
      - name: Upload qualified recovery bundle
        uses: actions/upload-artifact@v7
        with:
          name: sdk-recovery-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidates
            final-evidence
          if-no-files-found: error
          retention-days: 14
