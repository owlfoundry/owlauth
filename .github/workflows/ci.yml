name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Verify Rust SDK package
        run: |
          cargo package --manifest-path sdks/rust/Cargo.toml --locked --allow-dirty
          package_files="$(cargo package --manifest-path sdks/rust/Cargo.toml --locked --allow-dirty --list)"
          grep -qx LICENSE <<< "$package_files"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Install locked dependencies
        run: uv sync --all-packages --locked
      - name: Run Ruff
        run: |
          uv run --locked ruff check sdks/python
          uv run --locked ruff format --check sdks/python
      - name: Run tests
        run: uv run --locked pytest
      - name: Build and verify package
        working-directory: sdks/python
        run: |
          rm -rf dist
          uv run --locked hatchling build -d dist
          uv run --locked twine check dist/*
          wheel_contents="$(unzip -Z1 dist/*.whl)"
          grep -Eq '\.dist-info/licenses/LICENSE$' <<< "$wheel_contents"

  typescript:
    name: TypeScript Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up tooling Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @owlauth/client check
      - name: Build package
        run: pnpm --filter @owlauth/client build
      - name: Verify npm package contents
        working-directory: sdks/typescript
        run: npm pack --dry-run --json | jq -e '.[0].files | any(.path == "LICENSE")'
      - name: Set up runtime Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests on supported Node.js
        run: node --test sdks/typescript/test/*.test.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build documentation
        run: pnpm --filter @owlauth/docs build
      - name: Verify sitemap
        run: |
          test -f docs/.vitepress/dist/sitemap.xml
          test -f docs/.vitepress/dist/robots.txt
          grep -q 'https://owlauth.owlfoundry.org/' docs/.vitepress/dist/sitemap.xml
          grep -qx 'Sitemap: https://owlauth.owlfoundry.org/sitemap.xml' docs/.vitepress/dist/robots.txt
      - name: Dry-run documentation deployment
        run: pnpm --filter @owlauth/docs run deploy --dry-run

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Validate plugin metadata
        run: |
          for file in \
            .agents/plugins/marketplace.json \
            .claude-plugin/marketplace.json \
            plugins/owlauth/.claude-plugin/plugin.json \
            plugins/owlauth/.codex-plugin/plugin.json; do
            jq empty "$file"
          done
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"
          test -f plugins/owlauth/skills/owlauth-integration/SKILL.md
          test -f plugins/owlauth/skills/owlauth-integration/references/sdk-examples.md
      - name: Validate Claude plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate plugins/owlauth
      - name: Smoke-test Codex plugin installation
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex@0.145.0 plugin marketplace add . --json
          npx --yes @openai/codex@0.145.0 plugin add owlauth@owlauth --json

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build server image
        run: |
          docker build \
            --build-arg OWLAUTH_VERSION=ci \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag owlauth:ci \
            .
      - name: Smoke-test server image
        run: scripts/docker/smoke-server-image.sh owlauth:ci

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Generate and validate OpenAPI
        run: |
          cargo run --locked --package owlauth -- --openapi > "${RUNNER_TEMP}/owlauth-openapi.json"
          python3 -m json.tool "${RUNNER_TEMP}/owlauth-openapi.json" >/dev/null
      - name: Validate JSON fixtures
        run: |
          python3 -m json.tool sdks/spec/fixtures/health-response.json >/dev/null
          python3 -m json.tool sdks/spec/conformance/cases.json >/dev/null
      - name: Test release eligibility checks
        run: scripts/release/test-verify-release.sh
