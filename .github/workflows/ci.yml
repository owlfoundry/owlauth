name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-web:
    name: Hosted web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild embedded assets
        run: pnpm --filter @owlauth/server-web build
      - name: Run hosted-web checks
        run: pnpm --filter @owlauth/server-web check
      - name: Install Chromium for the real browser journey
        run: pnpm --filter @owlauth/server-web exec playwright install --with-deps chromium
      - name: Build the browser-test server
        run: cargo build --locked --package owlauth-server
      - name: Run real PostgreSQL and Rust provisioning-readiness journey
        run: pnpm --filter @owlauth/server-web exec playwright test --project=chromium
      - name: Reject generated contract or asset drift
        run: git diff --exit-code -- crates/owlauth-server/web/src/generated crates/owlauth-server/web/dist

  rust:
    name: Rust stable
    needs: hosted-web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      OWLAUTH_REQUIRE_DOCKER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Verify publishable Rust packages
        run: |
          for manifest in \
            crates/owlauth-types/Cargo.toml \
            crates/owlauth-cli/Cargo.toml \
            sdks/rust/Cargo.toml; do
            cargo package --manifest-path "$manifest" --locked --allow-dirty
            package_files="$(cargo package --manifest-path "$manifest" --locked --allow-dirty --list)"
            grep -qx LICENSE <<< "$package_files"
          done
          # The server package uses the just-packaged unpublished owlauth-types through
          # a temporary local patch and must compile without network access.
          scripts/test-server-package.sh
      - name: Verify Rust product boundaries
        run: |
          cli_tree="$(cargo tree --locked --package owlauth-cli --edges normal --prefix none)"
          if grep -Eq '^owlauth-server |^owlauth_server ' <<< "$cli_tree"; then
            echo "CLI must not depend on owlauth-server" >&2
            exit 1
          fi
          server_tree="$(cargo tree --locked --package owlauth-server --edges normal --prefix none)"
          if grep -Eq '^owlauth-client |^owlauth_client ' <<< "$server_tree"; then
            echo "server must not depend on owlauth-client" >&2
            exit 1
          fi
      - name: Smoke-test CLI
        run: |
          cargo run --locked --package owlauth-cli -- --version
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/owlauth-cli/Cargo.toml | head -n 1)"
          cargo run --locked --package owlauth-cli -- update \
            --version "$version" --force --dry-run --install-dir "${RUNNER_TEMP}/bin"

  windows-cli:
    name: Windows CLI self-update
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Test Windows updater
        run: cargo test --locked --package owlauth-cli
      - name: Build CLI
        run: cargo build --locked --package owlauth-cli
      - name: Exercise Windows self-replacement
        shell: pwsh
        env:
          RELEASE_VERSION: 0.0.3
        run: |
          $InstallDirectory = Join-Path $env:RUNNER_TEMP "owlauth-self-update"
          New-Item -ItemType Directory -Force -Path $InstallDirectory | Out-Null
          $Binary = Join-Path $InstallDirectory "owlauth.exe"
          Copy-Item target/debug/owlauth.exe $Binary
          & $Binary update --version $env:RELEASE_VERSION --force --install-dir $InstallDirectory
          if ($LASTEXITCODE -ne 0) { throw "self-update command failed" }
          foreach ($attempt in 1..30) {
              try { $ReportedVersion = & $Binary --version 2>$null } catch { $ReportedVersion = $null }
              if ($LASTEXITCODE -eq 0 -and $ReportedVersion -eq "owlauth $env:RELEASE_VERSION") { exit 0 }
              Start-Sleep -Seconds 1
          }
          throw "updated CLI did not report version $env:RELEASE_VERSION"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Install locked dependencies
        run: uv sync --all-packages --locked
      - name: Run Ruff
        run: |
          uv run --locked ruff check sdks/python
          uv run --locked ruff format --check sdks/python
      - name: Run tests
        run: uv run --locked pytest
      - name: Build and verify package
        working-directory: sdks/python
        run: |
          rm -rf dist
          uv run --locked hatchling build -d dist
          uv run --locked twine check dist/*
          wheel_contents="$(unzip -Z1 dist/*.whl)"
          grep -Eq '\.dist-info/licenses/LICENSE$' <<< "$wheel_contents"

  typescript:
    name: TypeScript Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up tooling Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @owlauth/client check
      - name: Build package
        run: pnpm --filter @owlauth/client build
      - name: Verify npm package contents
        working-directory: sdks/typescript
        run: npm pack --dry-run --json | jq -e '.[0].files | any(.path == "LICENSE")'
      - name: Set up runtime Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests on supported Node.js
        run: node --test sdks/typescript/test/*.test.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Markdown links
        run: python3 scripts/check-markdown-links.py
      - name: Build documentation
        run: pnpm --filter @owlauth/docs build
      - name: Verify sitemap
        run: |
          test -f docs/.vitepress/dist/sitemap.xml
          test -f docs/.vitepress/dist/robots.txt
          grep -q 'https://owlauth.owlfoundry.org/' docs/.vitepress/dist/sitemap.xml
          grep -qx 'Sitemap: https://owlauth.owlfoundry.org/sitemap.xml' docs/.vitepress/dist/robots.txt
      - name: Dry-run documentation deployment
        run: pnpm --filter @owlauth/docs run deploy --dry-run

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate plugin metadata
        run: |
          for file in \
            .agents/plugins/marketplace.json \
            .claude-plugin/marketplace.json \
            plugins/owlauth/.claude-plugin/plugin.json \
            plugins/owlauth/.codex-plugin/plugin.json; do
            jq empty "$file"
          done
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"
          test -f plugins/owlauth/skills/owlauth-integration/SKILL.md
          test -f plugins/owlauth/skills/owlauth-integration/references/sdk-examples.md
      - name: Validate Claude plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate plugins/owlauth
      - name: Smoke-test Codex plugin installation
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex@0.145.0 plugin marketplace add . --json
          npx --yes @openai/codex@0.145.0 plugin add owlauth@owlauth --json

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Build server image
        run: |
          docker build \
            --build-arg OWLAUTH_VERSION=ci \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag owlauth:ci \
            .
      - name: Smoke-test server image
        run: scripts/docker/smoke-server-image.sh owlauth:ci

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Go for workflow validation
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: false
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Generate and validate OpenAPI
        run: |
          for plane in runtime control; do
            cargo run --locked --package owlauth-types --bin export-openapi -- \
              "$plane" "${RUNNER_TEMP}/${plane}-openapi.json"
            python3 -m json.tool "${RUNNER_TEMP}/${plane}-openapi.json" >/dev/null
          done
      - name: Validate JSON fixtures
        run: |
          python3 -m json.tool sdks/spec/fixtures/health-response.json >/dev/null
          python3 -m json.tool sdks/spec/conformance/cases.json >/dev/null
      - name: Test release tooling and installers
        run: |
          scripts/release/test-verify-release.sh
          python3 scripts/release/test-changelog.py
          python3 scripts/release/test-prepare-release.py
          sh -n scripts/install.sh
          scripts/test-installers.sh
          cmp scripts/install.sh crates/owlauth-cli/assets/install.sh
          cmp scripts/install.ps1 crates/owlauth-cli/assets/install.ps1
          # shellcheck disable=SC2016
          pwsh -NoProfile -NonInteractive -Command \
            '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors); if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }'
