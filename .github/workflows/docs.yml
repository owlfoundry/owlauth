name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build documentation
        run: pnpm --filter @owlauth/docs build
      - name: Verify sitemap
        run: |
          test -f docs/.vitepress/dist/sitemap.xml
          test -f docs/.vitepress/dist/robots.txt
          grep -q 'https://owlauth.owlfoundry.org/' docs/.vitepress/dist/sitemap.xml
          grep -qx 'Sitemap: https://owlauth.owlfoundry.org/sitemap.xml' docs/.vitepress/dist/robots.txt
      - name: Dry-run documentation deployment
        run: pnpm --filter @owlauth/docs run deploy --dry-run
      - name: Upload documentation artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: owlauth-docs
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy docs
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download documentation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: owlauth-docs
          path: docs/.vitepress/dist
      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          configured=false
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            configured=true
          else
            echo "::notice::Skipping deployment until Cloudflare environment secrets are configured"
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @owlauth/docs run deploy
