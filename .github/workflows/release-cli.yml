name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Verify tag, version, and commit
        id: release
        run: |
          version="$(scripts/release/verify-release.sh cli)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component cli \
            --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v7
        with:
          name: cli-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build CLI (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain stable
      - name: Build CLI
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo build --release --locked --package owlauth-cli --target "${{ matrix.target }}"
      - name: Smoke-test CLI binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/owlauth"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          "$binary" --version
      - name: Package Unix CLI
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          archive="owlauth-cli-${VERSION}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" owlauth
      - name: Package Windows CLI
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          archive="owlauth-cli-${VERSION}-${TARGET}.zip"
          powershell -NoProfile -NonInteractive -Command \
            "Compress-Archive -LiteralPath 'target/$TARGET/release/owlauth.exe' -DestinationPath '$archive'"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: owlauth-cli-${{ matrix.target }}
          path: owlauth-cli-${{ needs.verify.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish CLI release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: owlauth-cli-*
          path: artifacts
          merge-multiple: true
      - name: Download release changelog
        uses: actions/download-artifact@v8
        with:
          name: cli-release-notes
          path: release-metadata
      - name: Verify artifact set and create checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          expected=(
            "owlauth-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "owlauth-cli-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "owlauth-cli-${VERSION}-x86_64-apple-darwin.tar.gz"
            "owlauth-cli-${VERSION}-aarch64-apple-darwin.tar.gz"
            "owlauth-cli-${VERSION}-x86_64-pc-windows-msvc.zip"
          )
          for asset in "${expected[@]}"; do test -f "artifacts/$asset"; done
          test "$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"
          (cd artifacts && sha256sum owlauth-cli-* > SHA256SUMS)
          cp scripts/install.sh scripts/install.ps1 artifacts/
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh cli >/dev/null
      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish CLI crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          scripts/release/publish-crate.sh \
            crates/owlauth-types/Cargo.toml "$VERSION"
          for attempt in {1..12}; do
            if scripts/release/publish-crate.sh \
              crates/owlauth-cli/Cargo.toml "$VERSION"; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              exit 1
            fi
            sleep 10
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "cli-v${VERSION}" artifacts/* \
            --notes-file release-metadata/release-notes.md \
            --title "OwlAuth CLI v${VERSION}"
