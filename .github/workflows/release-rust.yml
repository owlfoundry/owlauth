name: Release Rust SDK

on:
  push:
    tags:
      - "rust-v*"

permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Verify tag, version, and commit
        id: release
        run: |
          version="$(scripts/release/verify-release.sh rust)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component rust --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and inspect package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cargo package --manifest-path sdks/rust/Cargo.toml \
            --locked --allow-dirty --no-verify
          archive="target/package/owlauth-client-${VERSION}.crate"
          test -f "$archive"
          python3 scripts/sdk_artifact.py inspect \
            --component rust --archive "$archive"
          mkdir dist
          cp "$archive" dist/
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-package
          path: dist/*.crate
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish owlauth-client
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh rust >/dev/null
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Download inspected package
        uses: actions/download-artifact@v8
        with:
          name: rust-release-package
          path: dist
      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          scripts/release/publish-crate.sh \
            sdks/rust/Cargo.toml "$VERSION" \
            "dist/owlauth-client-${VERSION}.crate"

  release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: rust-release-package
          path: dist
      - name: Download release changelog
        uses: actions/download-artifact@v8
        with:
          name: rust-release-notes
          path: release-metadata
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "rust-v${VERSION}" \
            "dist/owlauth-client-${VERSION}.crate" \
            --notes-file release-metadata/release-notes.md \
            --title "Rust SDK v${VERSION}"
