name: Release Rust SDK

on:
  push:
    branches:
      - "release/sdk/rust/**"

permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify branch, version, commit, and tag
        id: release
        run: |
          version="$(scripts/release/verify-release.sh rust)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish owlauth-client
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh rust >/dev/null
      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --manifest-path sdks/rust/Cargo.toml
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          notes_args=(--generate-notes)
          previous_tag="$(git tag --list 'rust-v*' --sort=-v:refname | sed -n '1p')"
          if [[ -n "$previous_tag" ]]; then
            notes_args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "rust-v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Rust SDK v${VERSION}" \
            "${notes_args[@]}"
