name: Release TypeScript SDK

on:
  push:
    branches:
      - "release/sdk/typescript/**"

permissions:
  contents: read

concurrency:
  group: release-typescript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify branch, version, commit, and tag
        id: release
        run: |
          version="$(scripts/release/verify-release.sh typescript)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component typescript --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v6
        with:
          name: typescript-release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish @owlauth/client
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @owlauth/client build
      - name: Download release changelog
        uses: actions/download-artifact@v7
        with:
          name: typescript-release-notes
          path: release-metadata
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh typescript >/dev/null
      - name: Publish package with npm trusted publishing
        working-directory: sdks/typescript
        run: npm publish --access public --provenance
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "typescript-v${VERSION}" \
            --notes-file release-metadata/release-notes.md \
            --target "$GITHUB_SHA" \
            --title "TypeScript SDK v${VERSION}"
