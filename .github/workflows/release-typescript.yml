name: Release TypeScript SDK

on:
  push:
    tags:
      - "typescript-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-typescript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Verify tag, version, and commit
        id: release
        run: |
          version="$(scripts/release/verify-release.sh typescript)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component typescript --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v7
        with:
          name: typescript-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and inspect package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir dist
          pnpm --filter @owlauth/client build
          (cd sdks/typescript && npm pack --pack-destination ../../dist)
          archive="dist/owlauth-client-${VERSION}.tgz"
          test -f "$archive"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1
          python3 scripts/sdk_artifact.py inspect \
            --component typescript --archive "$archive"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: typescript-release-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @owlauth/client
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Re-verify release eligibility
        run: scripts/release/verify-release.sh typescript >/dev/null
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: typescript-release-package
          path: dist
      - name: Publish package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm publish "./dist/owlauth-client-${VERSION}.tgz" --access public --provenance

  release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: typescript-release-package
          path: dist
      - name: Download release changelog
        uses: actions/download-artifact@v8
        with:
          name: typescript-release-notes
          path: release-metadata
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "typescript-v${VERSION}" \
            "dist/owlauth-client-${VERSION}.tgz" \
            --notes-file release-metadata/release-notes.md \
            --title "TypeScript SDK v${VERSION}"

  recover-0-1-2:
    name: Recover TypeScript SDK v0.1.2
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: 0.1.2
      TAG: typescript-v0.1.2
      SOURCE_COMMIT: d86e072ae576b7338d72a7a19856ac5ed6cc7c47
      TAG_OBJECT: 1d700afe9e69db6dad3b9a2195041ef6f0844aaa
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: d86e072ae576b7338d72a7a19856ac5ed6cc7c47
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release tag
        run: |
          test "$TAG" = "typescript-v${VERSION}"
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_COMMIT"
          test "$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')" = "$TAG_OBJECT"
          test "$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')" = "$SOURCE_COMMIT"
      - name: Prepare package and release notes
        run: |
          python3 scripts/release/prepare_release.py typescript "$VERSION"
          python3 scripts/release/generate-changelog.py \
            --component typescript --version "$VERSION" --output release-notes.md
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and inspect package
        run: |
          mkdir dist
          pnpm --filter @owlauth/client build
          (cd sdks/typescript && npm pack --pack-destination ../../dist)
          archive="dist/owlauth-client-${VERSION}.tgz"
          test -f "$archive"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1
          python3 scripts/sdk_artifact.py inspect \
            --component typescript --archive "$archive"
      - name: Publish package
        run: npm publish "./dist/owlauth-client-${VERSION}.tgz" --access public --provenance
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/owlauth-client-${VERSION}.tgz" \
            --notes-file release-notes.md \
            --title "TypeScript SDK v${VERSION}"
