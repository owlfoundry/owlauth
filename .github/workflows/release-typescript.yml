name: Release TypeScript SDK

on:
  push:
    tags:
      - "typescript-v*"

permissions:
  contents: read

concurrency:
  group: release-typescript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Verify tag, version, and commit
        id: release
        run: |
          version="$(scripts/release/verify-release.sh typescript)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        run: |
          python3 scripts/release/generate-changelog.py \
            --component typescript --version "${{ steps.release.outputs.version }}" \
            --output release-notes.md
      - name: Upload release changelog
        uses: actions/upload-artifact@v6
        with:
          name: typescript-release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    name: Full CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: Publish @owlauth/client
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Python for candidate verification
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Download immutable SDK candidate
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.ci.outputs.typescript-candidate-artifact-name }}
          path: candidate
      - name: Download final SDK evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.ci.outputs.sdk-final-evidence-artifact-name }}
          path: final-evidence
      - name: Download release changelog
        uses: actions/download-artifact@v7
        with:
          name: typescript-release-notes
          path: release-metadata
      - name: Re-verify release and exact candidate
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CANDIDATE_VERSION: ${{ needs.ci.outputs.typescript-candidate-version }}
          ARCHIVE_SHA256: ${{ needs.ci.outputs.typescript-candidate-archive-sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.ci.outputs.typescript-candidate-descriptor-sha256 }}
        run: |
          scripts/release/verify-release.sh typescript >/dev/null
          [[ "$CANDIDATE_VERSION" == "$VERSION" ]]
          archive="candidate/owlauth-client-${VERSION}.tgz"
          verified_sha="$(python scripts/release/verify-sdk-candidate.py \
            --component typescript --version "$VERSION" --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-configuration typescript-npm-pack-v1 --tag "$GITHUB_REF_NAME" \
            --descriptor candidate/candidate.json --archive "$archive")"
          [[ "$verified_sha" == "$ARCHIVE_SHA256" ]]
          actual_descriptor_sha="$(sha256sum candidate/candidate.json | cut -d ' ' -f 1)"
          [[ "$actual_descriptor_sha" == "$DESCRIPTOR_SHA256" ]]
      - name: Verify final Block E evidence
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python scripts/release/verify-sdk-evidence.py \
            --component typescript --version "$VERSION" --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --tag "$GITHUB_REF_NAME" --descriptor candidate/candidate.json \
            --manifest final-evidence/typescript-final-evidence.json >/dev/null
          cat final-evidence/summary.md >> release-metadata/release-notes.md
      - name: Publish the qualified tarball with npm trusted publishing
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm publish "candidate/owlauth-client-${VERSION}.tgz" --access public --provenance
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "typescript-v${VERSION}" \
            final-evidence/typescript-final-evidence.json \
            --notes-file release-metadata/release-notes.md \
            --title "TypeScript SDK v${VERSION}"
