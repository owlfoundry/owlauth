name: Recover CLI Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_TAG: cli-v0.1.1
  SOURCE_TAG_OBJECT: 323c190088849f8d98b33220da1a5cd13460026f
  SOURCE_COMMIT: 1f7bd83b4ee402f3c7b3fce6f7c431b2ff368f34
  QUALIFYING_CI_RUN: "31251952263"
  FAILED_RELEASE_RUN: "31253163171"
  VERSION: 0.1.1

concurrency:
  group: recover-cli-v0.1.1
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify frozen release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out recovery definition
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tag and current recovery scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          git fetch --quiet --force origin \
            "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          [[ "$(git cat-file -t "refs/tags/$SOURCE_TAG")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG")" == "$SOURCE_TAG_OBJECT" ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")" == "$SOURCE_COMMIT" ]]
          [[ "$(git tag --list "$SOURCE_TAG" --format='%(contents:subject)')" == \
            "OwlAuth CLI v$VERSION" ]]

          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/$SOURCE_TAG" "refs/tags/$SOURCE_TAG^{}")"
          [[ "$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")" == \
            "$SOURCE_TAG_OBJECT" ]]
          [[ "$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")" == \
            "$SOURCE_COMMIT" ]]
          [[ -z "$(git ls-remote --tags origin \
            'refs/tags/server-v0.1.1' 'refs/tags/server-v0.1.1^{}')" ]]
          shared_refs="$(git ls-remote --tags origin \
            'refs/tags/server-v*' 'refs/tags/cli-v*')"
          printf '%s\n' "$shared_refs" |
            python3 scripts/release/verify-shared-crate-version.py \
              --version "$VERSION" --current-tag "$SOURCE_TAG"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"

          unexpected="$(git diff --name-only "$SOURCE_COMMIT" "$GITHUB_SHA" -- \
            ':(exclude).github/actionlint.yaml' \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude).github/workflows/recover-cli-release.yml')"
          [[ -z "$unexpected" ]]

          run_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFYING_CI_RUN")"
          [[ "$(jq -r .name <<<"$run_json")" == CI ]]
          [[ "$(jq -r .path <<<"$run_json")" == .github/workflows/ci.yml ]]
          [[ "$(jq -r .event <<<"$run_json")" == push ]]
          [[ "$(jq -r .head_branch <<<"$run_json")" == main ]]
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$SOURCE_COMMIT" ]]
          [[ "$(jq -r .status <<<"$run_json")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$run_json")" == success ]]

          failed_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RELEASE_RUN")"
          [[ "$(jq -r .path <<<"$failed_json")" == \
            .github/workflows/release-cli.yml ]]
          [[ "$(jq -r .event <<<"$failed_json")" == push ]]
          [[ "$(jq -r .head_branch <<<"$failed_json")" == "$SOURCE_TAG" ]]
          [[ "$(jq -r .head_sha <<<"$failed_json")" == "$SOURCE_COMMIT" ]]
          [[ "$(jq -r .status <<<"$failed_json")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$failed_json")" == failure ]]
          jobs_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RELEASE_RUN/jobs?per_page=100")"
          [[ "$(jq -r '.jobs[] | select(.name == "Verify release tag") | .conclusion' \
            <<<"$jobs_json")" == success ]]
          [[ "$(jq -r '.jobs[] | select(.name == "Full CI / Contract") | .conclusion' \
            <<<"$jobs_json")" == failure ]]
          [[ "$(jq -r '.jobs[] | select(.name == "Publish CLI release") | .conclusion' \
            <<<"$jobs_json")" == skipped ]]
      - name: Exercise release preparation from the frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and validate CLI manifests
        run: |
          python3 scripts/release/prepare_release.py cli "$VERSION"
          python3 scripts/release/prepare_release.py cli "$VERSION"
          cargo metadata --locked --no-deps >/dev/null

  build:
    name: Build CLI (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare CLI release manifests
        run: python3 scripts/release/prepare_release.py cli "$VERSION"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain stable
      - name: Build CLI
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo build --release --locked --package owlauth-cli --target "${{ matrix.target }}"
      - name: Smoke-test CLI binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/owlauth"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          "$binary" --version | grep -F " $VERSION"
      - name: Package Unix CLI
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="owlauth-cli-${VERSION}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" owlauth
      - name: Package Windows CLI
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="owlauth-cli-${VERSION}-${TARGET}.zip"
          powershell -NoProfile -NonInteractive -Command \
            "Compress-Archive -LiteralPath 'target/$TARGET/release/owlauth.exe' -DestinationPath '$archive'"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: owlauth-cli-${{ matrix.target }}
          path: owlauth-cli-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish recovered CLI release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Re-verify frozen source and prepare manifests
        run: |
          git fetch --quiet --force origin \
            "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG")" == "$SOURCE_TAG_OBJECT" ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")" == "$SOURCE_COMMIT" ]]
          python3 scripts/release/prepare_release.py cli "$VERSION"
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: owlauth-cli-*
          path: artifacts
          merge-multiple: true
      - name: Verify artifact set and create checksums
        run: |
          expected=(
            "owlauth-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "owlauth-cli-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "owlauth-cli-${VERSION}-x86_64-apple-darwin.tar.gz"
            "owlauth-cli-${VERSION}-aarch64-apple-darwin.tar.gz"
            "owlauth-cli-${VERSION}-x86_64-pc-windows-msvc.zip"
          )
          for asset in "${expected[@]}"; do test -f "artifacts/$asset"; done
          [[ "$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq \
            "${#expected[@]}" ]]
          (cd artifacts && sha256sum owlauth-cli-* > SHA256SUMS)
          cp scripts/install.sh scripts/install.ps1 artifacts/
      - name: Stage or verify GitHub Release before registry publication
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- owlauth-recovery:cli-v0.1.1 -->'
          verify_release_assets() {
            local metadata="$1"
            local expected_assets actual_assets target asset_id asset_name
            expected_assets="$(printf '%s\n' \
              SHA256SUMS install.ps1 install.sh \
              "owlauth-cli-${VERSION}-aarch64-apple-darwin.tar.gz" \
              "owlauth-cli-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
              "owlauth-cli-${VERSION}-x86_64-apple-darwin.tar.gz" \
              "owlauth-cli-${VERSION}-x86_64-pc-windows-msvc.zip" \
              "owlauth-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz")"
            actual_assets="$(jq -r '.assets[].name' <<<"$metadata" | sort)"
            [[ "$actual_assets" == "$expected_assets" ]]

            rm -rf released current-* released-*
            mkdir released
            while IFS=$'\t' read -r asset_id asset_name; do
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                > "released/$asset_name"
            done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"$metadata")
            (cd released && sha256sum --check SHA256SUMS)
            cmp scripts/install.sh released/install.sh
            cmp scripts/install.ps1 released/install.ps1

            for target in \
              aarch64-apple-darwin aarch64-unknown-linux-gnu \
              x86_64-apple-darwin x86_64-unknown-linux-gnu; do
              mkdir "current-$target" "released-$target"
              tar -xzf "artifacts/owlauth-cli-${VERSION}-${target}.tar.gz" \
                -C "current-$target"
              tar -xzf "released/owlauth-cli-${VERSION}-${target}.tar.gz" \
                -C "released-$target"
              cmp "current-$target/owlauth" "released-$target/owlauth"
            done
            mkdir current-windows released-windows
            unzip -q "artifacts/owlauth-cli-${VERSION}-x86_64-pc-windows-msvc.zip" \
              -d current-windows
            unzip -q "released/owlauth-cli-${VERSION}-x86_64-pc-windows-msvc.zip" \
              -d released-windows
            cmp current-windows/owlauth.exe released-windows/owlauth.exe
          }

          pages="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          matches="$(jq --arg tag "$SOURCE_TAG" \
            '[.[][] | select(.tag_name == $tag)]' <<<"$pages")"
          match_count="$(jq 'length' <<<"$matches")"
          [[ "$match_count" -le 1 ]]
          if [[ "$match_count" -eq 1 ]]; then
            metadata="$(jq '.[0]' <<<"$matches")"
            release_id="$(jq -r .id <<<"$metadata")"
            [[ "$(jq -r .tag_name <<<"$metadata")" == "$SOURCE_TAG" ]]
            [[ "$(jq -r .name <<<"$metadata")" == "OwlAuth CLI v${VERSION}" ]]
            [[ "$(jq -r .prerelease <<<"$metadata")" == false ]]
            if [[ "$(jq -r .draft <<<"$metadata")" == true ]]; then
              grep -Fq "$marker" <<<"$(jq -r .body <<<"$metadata")"
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$release_id"
            else
              verify_release_assets "$metadata"
              echo 'state=published' >> "$GITHUB_OUTPUT"
              echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          python3 scripts/release/generate-changelog.py \
            --component cli --version "$VERSION" --output release-notes.md
          printf '\n%s\n' "$marker" >> release-notes.md
          metadata="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$SOURCE_TAG" \
            -f name="OwlAuth CLI v${VERSION}" \
            -f body="$(cat release-notes.md)" \
            -F draft=true \
            -F prerelease=false)"
          release_id="$(jq -r .id <<<"$metadata")"
          pages="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          matches="$(jq --arg tag "$SOURCE_TAG" \
            '[.[][] | select(.tag_name == $tag)]' <<<"$pages")"
          [[ "$(jq 'length' <<<"$matches")" -eq 1 ]]
          [[ "$(jq -r '.[0].id' <<<"$matches")" == "$release_id" ]]
          upload_url="$(jq -r .upload_url <<<"$metadata")"
          upload_url="${upload_url%%\{*}"
          for asset_path in artifacts/*; do
            asset_name="${asset_path##*/}"
            gh api --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "$asset_path" \
              "${upload_url}?name=${asset_name}" >/dev/null
          done
          metadata="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          [[ "$(jq -r .tag_name <<<"$metadata")" == "$SOURCE_TAG" ]]
          [[ "$(jq -r .name <<<"$metadata")" == "OwlAuth CLI v${VERSION}" ]]
          [[ "$(jq -r .draft <<<"$metadata")" == true ]]
          [[ "$(jq -r .prerelease <<<"$metadata")" == false ]]
          grep -Fq "$marker" <<<"$(jq -r .body <<<"$metadata")"
          verify_release_assets "$metadata"
          echo 'state=draft' >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish CLI crates idempotently
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          scripts/release/publish-crate.sh \
            crates/owlauth-types/Cargo.toml "$VERSION"
          for attempt in {1..12}; do
            if scripts/release/publish-crate.sh \
              crates/owlauth-cli/Cargo.toml "$VERSION"; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then exit 1; fi
            sleep 10
          done
      - name: Publish staged GitHub Release by immutable release ID
        if: steps.github_release.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.github_release.outputs.release_id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          metadata="$(gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false)"
          [[ "$(jq -r .id <<<"$metadata")" == "$RELEASE_ID" ]]
          [[ "$(jq -r .tag_name <<<"$metadata")" == "$SOURCE_TAG" ]]
          [[ "$(jq -r .name <<<"$metadata")" == "OwlAuth CLI v${VERSION}" ]]
          [[ "$(jq -r .draft <<<"$metadata")" == false ]]
          [[ "$(jq -r .prerelease <<<"$metadata")" == false ]]
          pages="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          matches="$(jq --arg tag "$SOURCE_TAG" \
            '[.[][] | select(.tag_name == $tag)]' <<<"$pages")"
          [[ "$(jq 'length' <<<"$matches")" -eq 1 ]]
          [[ "$(jq -r '.[0].id' <<<"$matches")" == "$RELEASE_ID" ]]

  update-smoke:
    name: Exercise recovered CLI update (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare CLI release manifests
        run: python3 scripts/release/prepare_release.py cli "$VERSION"
      - name: Resolve updater source CLI release
        id: source
        run: |
          git fetch --quiet --tags origin
          previous="$(git tag --list 'cli-v*' --sort=-version:refname |
            grep -Fvx "$SOURCE_TAG" | head -n 1 || true)"
          source="$previous"
          if [[ "$RUNNER_OS" == "Windows" && \
            ( "$previous" == "cli-v0.0.2" || "$previous" == "cli-v0.0.3" ) ]]; then
            source="$SOURCE_TAG"
          fi
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
          echo "tag=$source" >> "$GITHUB_OUTPUT"
          echo "updater source: ${source:-<none>}"
      - name: Install updater source CLI artifact
        if: steps.source.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_UPDATE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          source_version="${SOURCE_UPDATE_TAG#cli-v}"
          case "$RUNNER_OS" in
            Linux) target=x86_64-unknown-linux-gnu; extension=tar.gz ;;
            macOS) target=x86_64-apple-darwin; extension=tar.gz ;;
            Windows) target=x86_64-pc-windows-msvc; extension=zip ;;
          esac
          archive="owlauth-cli-${source_version}-${target}.${extension}"
          mkdir -p previous installed
          gh release download "$SOURCE_UPDATE_TAG" --pattern "$archive" --dir previous
          if [[ "$extension" == zip ]]; then
            powershell -NoProfile -NonInteractive -Command \
              "Expand-Archive -LiteralPath 'previous/$archive' -DestinationPath 'installed'"
          else
            tar -xzf "previous/$archive" -C installed
          fi
      - name: Update to recovered CLI release
        if: steps.source.outputs.tag != ''
        run: |
          binary=installed/owlauth
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          "$binary" update --version "$VERSION" --force --install-dir "$PWD/installed"
          for _ in {1..30}; do
            if "$binary" --version | grep -Fq " $VERSION"; then exit 0; fi
            sleep 1
          done
          echo "updated CLI did not report version $VERSION" >&2
          exit 1
      - name: Report first release
        if: steps.source.outputs.previous_tag == ''
        run: echo "No previous CLI release exists; upgrade smoke test starts with the next release."
