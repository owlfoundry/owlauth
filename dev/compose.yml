name: owlauth-dev

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OWLAUTH_DEV_POSTGRES_DB:-owlauth}
      POSTGRES_USER: ${OWLAUTH_DEV_POSTGRES_USER:-owlauth}
      POSTGRES_PASSWORD: ${OWLAUTH_DEV_POSTGRES_PASSWORD:-owlauth_dev}
    ports:
      - "${OWLAUTH_DEV_POSTGRES_HOST:-127.0.0.1}:${OWLAUTH_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
