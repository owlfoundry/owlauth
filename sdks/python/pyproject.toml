[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "owlauth-client"
version = "0.0.1"
description = "Python client for OwlAuth"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "OwlFoundry" }]
keywords = ["oauth", "oauth2", "authentication", "client"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/owlfoundry/owlauth"
Repository = "https://github.com/owlfoundry/owlauth"
Issues = "https://github.com/owlfoundry/owlauth/issues"

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "twine==6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/owlauth"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
