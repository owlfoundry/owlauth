[package]
name = "owlauth-client"
version = "0.0.0-dev"
edition.workspace = true
description = "Rust Project Auth client for OwlAuth"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["authentication", "identity", "project-auth", "client"]
categories = ["authentication", "api-bindings"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
getrandom = "0.3.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
time = { version = "0.3.47", features = ["parsing"] }
tokio = { version = "1.53.1", features = ["time"] }
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
