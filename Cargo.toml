[workspace]
members = [
    "crates/domain",
    "crates/protocol",
    "crates/server",
    "crates/storage",
    "sdks/rust",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/owlfoundry/owlauth"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
